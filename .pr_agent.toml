# Central PR-Agent configuration for the cuioss organization.
#
# Read by PR-Agent as the ORGANIZATION-LEVEL global settings file: the repository must be
# named exactly `pr-agent-settings`, and the file must sit at the root of its default branch.
# It is merged BENEATH any repository-local `.pr_agent.toml`, so a repo that overrides one
# key keeps everything else from this file.
#
# Rationale for every setting, and the non-obvious mechanics of this setup: ./README.adoc

[config]
# Gemini via VERTEX AI (`vertex_ai/…`), not AI Studio (`gemini/…`). Vertex draws on the GCP
# free-trial credits and is reached keylessly through Workload Identity Federation, so no
# Google credential is stored in GitHub. The upstream docs page still lists only
# `gemini/gemini-1.5-flash`; the authoritative list is the MAX_TOKENS registry in
# pr_agent/algo/__init__.py. See README.adoc "Upstream docs are stale".
#
# The GCP project and location are NOT here — they are deployment identity, carried as org
# variables by the reusable workflow, so the project id stays out of this public repo.
#
# There is NO AI Studio fallback: the GEMINI_API_KEY secret is deleted and the workflow no
# longer passes it, so a `gemini/…` id here would fail at the model call. Reviving that route
# means re-creating the secret AND re-adding the env line. A wrong model id used to cost one
# silent, review-less run per PR; the published-review gate now makes it fail loudly instead.
# This list is EVIDENCE, not preference. A self-selecting ladder was run once on purpose to find
# out what this project can serve, and plan-marshall#1031's run log answered:
#
#   gemini-3.5-pro   404 — not available to this project
#   gemini-3.1-pro   404 — not available to this project
#   gemini-2.5-pro   429 throttled, retried, then SERVED   ("model": "gemini-2.5-pro")
#
# Both 404 rungs are therefore removed: they cost ~8 wasted calls and roughly a minute per review
# to re-learn a fixed fact. Do NOT reinstate a 3.x *pro* id without first confirming the model
# card offers it — that tier is not available here, and the 404 message ("not found or your
# project does not have access to it") is ambiguous enough to look like a transient fault.
#
# What the project DOES offer from the 3 series is `gemini-3.6-flash` (Model Garden reports
# `publishers/google/models/gemini-3.6-flash`; the LiteLLM form prepends the provider). It leads
# here: newest generation, and it sidesteps the 429 backoff that 2.5-pro incurs. `gemini-2.5-pro`
# sits at the BACK of the ladder, not behind the leader.
#
# The ladder is ordered newest-generation-first, on Google's published head-to-head: 3.6-flash
# beats 3.1 PRO on all four coding and agentic benchmarks — SWE-Bench Pro 58.7 vs 54.2,
# Terminal-Bench 2.1 78.0 vs 73.8, MLE-Bench 63.9 vs 42.6, DeepSWE v1.1 49 vs 12. Pro keeps only
# narrow leads on pure reasoning (GPQA 94.3 vs 92.8, HLE 44.4 vs 38.3), which is not this
# workload. 2.5-pro is a generation older still, so ranking it ahead of a 3-series flash would
# have made a fallback a downgrade.
#
# Do not "promote to pro" as a remedy for thin reviews. That was proposed here once and was
# wrong twice over: it contradicts the benchmarks above, and review depth turned out to be
# governed by the charter in [pr_reviewer], not by the model — see the note there.
model = "vertex_ai/gemini-3.6-flash"
fallback_models = [
    "vertex_ai/gemini-3.5-flash",
    "vertex_ai/gemini-2.5-flash",
    "vertex_ai/gemini-2.5-pro",
]

# REQUIRED by the model above, not optional tuning. `gemini-3.6-flash` is absent from
# pr_agent/algo/__init__.py MAX_TOKENS in the pinned image (the table stops at the 3.5 pair), and
# an unregistered model does not degrade gracefully — utils.py get_max_tokens() RAISES unless
# custom_model_max_tokens is positive. This value is the model's real window; max_model_tokens
# below still clamps it, because get_max_tokens() takes the min of the two.
#
# Delete this line the day the pinned image registers the model, and not before.
custom_model_max_tokens = 1048576

# REQUIRED by the Gemini 3 generation. PR-Agent defaults to 0.2 — a Gemini-2.5-era setting — and
# Google's Gemini 3 guidance is explicit and unusually strong:
#
#   "For all Gemini 3 models, we strongly recommend keeping the temperature parameter at its
#    default value of 1.0. [...] lowering it may lead to unexpected behavior, such as looping or
#    degraded performance, particularly in complex mathematical or reasoning tasks."
#
# The migration section repeats it as an action item: remove explicit temperature parameters,
# especially low ones. Earlier models rewarded lowering temperature for determinism; on Gemini 3
# that intuition is actively harmful, because its reasoning is tuned for the default.
#
# This was NOT dead config — 0.2 reached the model on every review this org has ever run.
# Verified end to end in the pinned image: pr_reviewer.py:233 passes
# get_settings().config.temperature into chat_completion(), and litellm_ai_handler.py sets
# kwargs["temperature"] for every model NOT in NO_SUPPORT_TEMPERATURE_MODELS — a list of
# o1/o3/o4/gpt-5-codex and Claude Opus ids containing no Gemini entry.
temperature = 1.0

# Upstream defaults this to 32000, which silently caps what the reviewer ever SEES: with
# large_patch_policy = "clip", any diff above the limit is truncated before the model reads it.
# Promoting to a larger-context model without raising this would buy the stronger model and
# still feed it a truncated diff.
#
# Clipping does not merely reduce coverage — it manufactures CONFIDENT WRONG findings, which is
# worse than a missed one. API-Sheriff#118 (68 files, 6706 additions, AES-GCM cookie sealing)
# logged `Tokens: 168188, total tokens over limit: 128000` and reported an "Uncompleted Future
# Hang": that `leader.complete(outcome)` could be bypassed on a throw, leaving coalesced waiters
# blocked forever. The method has an unconditional `finally { leader.complete(...) }` that makes
# it impossible — and the reviewer QUOTED the opening of that very finally block, clipped off
# just before the line that refutes it. A truncated diff reads as a complete one to the model.
#
# 256000 is sized on evidence, not taste: 2x the largest real diff observed (168188), which keeps
# a normal-sized security change in this org inside the window. Still a quarter of the 1M
# ceiling, because unbounded turns one pathological pull request into a pathological bill.
#
# Raising this does NOT make a clipped review detectable — it only makes clipping rarer. The
# "over limit" line in the run log remains the only signal, and a review published above the
# limit must be read as INCONCLUSIVE rather than clean. See README.adoc "A clipped diff".
max_model_tokens = 256000

# Upstream defaults this to 500, which silently truncated the PR description on most of our pull
# requests. git_provider.py:250-262 clips the description with clip_tokens() before it reaches the
# prompt, and pr_reviewer_prompts.toml places it in the "--PR Info--" block the reviewer reads for
# intent. plan-marshall#1027's body is 4503 characters — roughly 1100-1300 tokens — so well over
# half of it never reached the model, with no marker and no log line.
#
# This is the description channel's version of the clipped-diff defect: the reviewer receives a
# fragment and treats it as the whole statement of intent. It matters more here than it looks,
# because the PR description is the ONLY route by which authored intent reaches this reviewer —
# repo_context_files reads the DEFAULT BRANCH (repo_context.py passes from_default_branch=True),
# so a document committed on the PR branch is invisible to it, and pointing it at the head would
# let PR content rewrite the reviewer's own instructions.
#
# 2000 gives roughly 4x headroom over the largest body observed. Cost is negligible against a
# 256000-token window.
max_description_tokens = 2000

# Upstream defaults this to [".md", ".txt"]. The name is misleading and cost us a wrong reading
# once: it does NOT exclude those files from the review. git_patch_processing.py extend_patch()
# calls should_skip_patch() and, when it matches, returns the patch UNCHANGED — the hunks still
# reach the model. What is skipped is only the patch EXTENSION: the patch_extra_lines_before /
# _after source lines spliced around each hunk. (Markdown is also absent from the effective
# bad_extensions list — `md` and `txt` sit in bad_extensions.extra, which is inert while
# use_extra_bad_extensions is false, as it is here.)
#
# `.md` is removed because in this org markdown is not documentation about the code — in
# plan-marshall it IS the executable contract: skills, standards and workflow files are read by
# the agent at runtime. A two-line diff in a standards document is not reviewable without the
# rule it sits inside, whereas a Python hunk usually carries its own context in the identifiers.
#
# `.txt` keeps the skip: prose with no contract weight, and no context worth paying for.
patch_extension_skip_types = [".txt"]

# The reviewer never pushes code, so it never needs elevated permissions. This lets every
# caller workflow run without `contents: write`.
restricted_mode = true

# No "Preparing review..." placeholder comment — it is UI chatter, and it is what forced the
# bot-sender de-loop guard upstream.
publish_output_progress = false

# Review against this org's documented project rules (branch prefixes, build conventions,
# workflow discipline), not just generic code quality. This is the one capability the other
# two reviewers lack. Read from the default branch only — never from the PR head — so PR
# content cannot rewrite the reviewer's own instructions.
repo_context_files = ["CLAUDE.md", "AGENTS.md"]
repo_context_from_default_branch = true

# --- Deliberately ABSENT: the skip rules ---------------------------------------------------
# ignore_pr_labels / ignore_pr_authors / ignore_pr_title / ignore_pr_{source,target}_branches
# are consumed ONLY by the webhook servers (should_process_pr_logic), never by the GitHub
# Action runner. Setting them here would be dead config that silently reviews everything.
# The org skip rules (dependabot[bot], cuioss-release-bot[bot], the skip-bot-review label)
# are enforced as job-level `if:` guards in
#   cuioss/cuioss-organization/.github/workflows/reusable-pr-agent-review.yml
# See README.adoc "ignore_pr_* is dead config in GitHub Action mode" — the single most
# important thing to know about this setup.
# ------------------------------------------------------------------------------------------

[pr_reviewer]
# Charter: this is the THIRD reviewer, beside CodeRabbit and Sourcery. It is pointed at the
# security depth lost when the consumer tier of Gemini Code Assist was retired.
#
# This text was rewritten after being measured, and the measurement was unambiguous: across five
# pull requests, four models (3.5-flash, 2.5-pro, 3.6-flash) and diffs from 5k to 57k tokens,
# EVERY published review was byte-identical at 242 bytes — the bare table, zero findings. A
# result invariant under model swap is not a model result.
#
# The controlled run that settled it: `/review` on plan-marshall#1027 — gemini-3.6-flash, full
# 40748-token diff with no pruning, against the final commit. In that same diff CodeRabbit had
# already reported a TOCTOU race around `shutil.move` and an empty-string filename resolving to
# a directory. Both sit inside the charter below. This reviewer reported neither.
#
# The cause was this text. Upstream's own field description for key_issues_to_review is ALREADY
# conservative ("Only include issues you are confident about... An empty list is acceptable"),
# and the previous charter stacked three further suppressors on top of it, with nothing pushing
# the other way:
#
#   "do not duplicate [the other reviewers]"   — an instruction to withhold, and the model cannot
#                                                know what the other two actually reported
#   "only when you can name the concrete input" — redundant with the base confidence gate
#   "prefer one well-evidenced finding"         — resolves to zero when nothing reaches certainty
#
# The scope was wrong for this codebase too: six classical AppSec bullets (injection, SSRF,
# authn) that Python tooling repositories almost never contain, so the model correctly concluded
# its assignment was empty. The defect classes we actually ship — concurrency, resource
# lifecycle, fail-open error handling, state corruption — were a sub-clause of one bullet.
#
# Do NOT reintroduce withholding language here. Overlap with the other two reviewers costs one
# duplicate comment; suppression costs the finding. That trade is not close. The charter was
# written against a failure mode we never had (noise) and produced the opposite one.
#
# The closing paragraph — treat stated intent as a claim to check — is deliberately CONDITIONAL
# ("If the pull request description states..."). The reviewer reads the description from the
# "--PR Info--" block, and nothing guarantees a description states intent at all. Writing the
# clause conditionally makes it correct in both worlds: inert when there is no stated intent, and
# active the moment a generator starts emitting one. That removes a cross-repository sequencing
# hazard — this file and the tool that writes pull request bodies can land in either order.
#
# Its purpose is to pre-empt an anchoring failure rather than a suppression one. Telling a
# reviewer what a change was meant to do invites it to confirm the account instead of examining
# the code — the same pressure that produced five empty reviews, arriving as context rather than
# as instruction. See README.adoc "The PR description is the only route for authored intent".
# The last two paragraphs answer a DIFFERENT suppressor from the one above, and it is the harder
# one because it does not live in this file. "No major issues detected" is not a setting and there
# is no severity filter to turn off — it is simply the text rendered when key_issues_to_review comes
# back empty. The suppression is in that field's own description, in the pinned image at
# pr_reviewer_prompts.toml:150:
#
#   "A concise list (0-{{ num_max_findings }} issues) of bugs, security vulnerabilities, or
#    significant performance concerns introduced in this PR. Only include issues you are confident
#    about. ... An empty list is acceptable if no clear issues are found."
#
# Four suppressors in one sentence — a low ceiling framed as "concise", a scope narrower than the
# categories above, a confidence gate, and explicit permission to say nothing. This text is not
# reachable from configuration: extra_instructions is appended as a separate block earlier in the
# system prompt, so it argues alongside the field description rather than replacing it.
#
# That is why the closing paragraphs address the empty-list permission directly instead of adding
# more categories. Category growth was already tried and is capped — see README.adoc
# "Recall beats precision". What was never addressed is the model's licence to report nothing.
#
# The anti-fabrication clause is load-bearing and must not be dropped when this is next tuned.
# Pressure to report more is exactly the pressure that produces invented mechanisms; this reviewer
# has done that once already (API-Sheriff#103, a confident finding about a branch that cannot be
# reached). Loosening the severity bar while HOLDING the substantiation bar is the whole design.
require_security_review = true
require_tests_review = true
extra_instructions = """
Prioritise security and correctness over style.

Report every issue you can substantiate, in these categories:
- Concurrency and time-of-check/time-of-use races; non-atomic file or state mutation;
  operations that are unsafe to retry or to run twice.
- Resource lifecycle: handles, locks, temporary files and subprocesses that leak or are not
  released on the error path.
- Fail-open error handling where fail-closed is required; swallowed exceptions; a guard whose
  predicate cannot fire; validation that admits the empty or degenerate input.
- Correctness bugs whose impact is data loss, state corruption, or a silently wrong result.
- Injection, deserialization, path traversal, SSRF and unsafe reflection.
- Authentication, authorization and trust-boundary errors; privilege escalation.
- Secret and credential handling, including values reaching logs or error messages.
- Dependency and supply-chain risk introduced by the change.
- Missing negative or adversarial test coverage for any of the above.

For each finding, name the input or state that triggers it and what goes wrong. Overlap with
other reviewers is acceptable — report the issue regardless of whether another tool might also
catch it. Do not withhold a substantiated finding because it seems minor or obvious.

If the pull request description states what the change is intended to do, treat that as a claim
to be checked, not as established fact. Report where the implementation diverges from the stated
intent, and never treat agreement with it as evidence that the code is correct.

Severity is not a reporting threshold. Report a finding you can substantiate even when it is
narrow, cheap to fix, or confined to test code — the reader decides what to act on, and a finding
declined as minor costs one line of triage. Do not weigh whether an issue is important enough to
mention.

An empty list remains the correct answer when the diff genuinely carries nothing substantiable, and
you must never invent a finding, pad the list, or report an issue whose mechanism you have not
traced in the code shown. But do not return an empty list because nothing reached a bar of severity
or importance. There is no such bar.
"""

# Suppress the parts of the review that are UI rather than findings.
require_ticket_analysis_review = false      # no linked-issue workflow in this org
require_estimate_effort_to_review = false
require_can_be_split_review = false
require_score_review = false
enable_intro_text = false
enable_help_text = false
enable_review_labels_security = false       # labels are not part of our workflow
enable_review_labels_effort = false
# Publish even when the review found nothing. This was `false` to suppress "No major issues
# detected" noise, but that made a clean review and a total failure INDISTINGUISHABLE at the pull
# request — both show no comment. It cost a real misread: plan-marshall#1024 was recorded as having
# had zero bot review and taken toward a merge decision on that basis, when this reviewer had in
# fact read the diff and cleared it ({"key_issues_to_review": [], "security_concerns": "No"}),
# visible only in a workflow log nobody reads.
#
# It also starved the consumer pipeline: plan-marshall's automatic-review collects `pr-comment`
# findings as its evidence of participation, so a reviewer that never speaks can never be counted
# — `enabled_bots` would claim three reviewers while the record could only ever show two.
#
# The cost is one short comment per clean pull request. That is the price of a reviewer whose
# agreement is observable, and a bot that is invisible whenever it agrees is worth far less than
# one that says so.
publish_output_no_suggestions = true

# One updated comment per PR, and inline suggestions fingerprinted so a push does not repost
# what is already on the PR.
persistent_comment = true
persistent_inline_comments = true

# Upstream defaults this to true, which posts a SECOND, separate comment every time the
# persistent review is refreshed:
#   **[Persistent review](<url>)** updated to latest commit <url>
# (git_provider.py publish_persistent_comment_full). It carries no review content, and it is
# redundant even as a pointer: the same call already stamps "(Review updated until commit …)"
# into the persistent comment's own header.
#
# It is not merely cosmetic. The comment is authored by the reviewer identity, so a consumer
# that collects the bot's comments as review findings — plan-marshall's automatic-review does
# exactly that — files it as a finding requiring triage. Setting publish_output_no_suggestions
# to true above made this worse, not better: clean pull requests now carry a persistent comment,
# so there is something to "update" on every subsequent review.
final_update_message = false

# Upstream defaults this to 3. It is not merely a cap — it is interpolated directly into the
# `key_issues_to_review` field description as "A concise list (0-{{ num_max_findings }} issues)",
# so the model reads it as the shape of an expected answer, not as a ceiling it is unlikely to
# reach. A low number and the word "concise" in the same sentence are a suppressor.
#
# Raised from 5 on the plan-marshall#1042 evidence, where CodeRabbit reported six substantiated
# findings across the same diff. Five was capable of binding.
#
# This does NOT license padding — the charter above forbids reporting an untraced mechanism, and
# that constraint is the one that must hold if this number is raised again.
num_max_findings = 12

[pr_code_suggestions]
# /improve is now reachable automatically, gated per PULL REQUEST by the `pr-agent-improve` label
# resolved in cuioss/cuioss-organization's reusable-pr-agent-review.yml. A caller's auto-improve
# input still forces it on for a whole repository. This block exists so that a labelled pull
# request gets the same deliberate tuning [pr_reviewer] gets, instead of silently falling back to
# upstream defaults on the one path that writes into the diff.
#
# Two things about /improve were ASSUMED for a long time and are now checked against upstream
# v0.39.0. Both were wrong in the direction that would have wasted the work. Citations and the
# stated coverage limit: README.adoc "What was actually checked about /improve".
#
#   - There is no `pr_reviewer.inline_code_comments`. Inline publishing is not a cheaper switch
#     on /review that would make this whole block unnecessary — it is a /improve capability,
#     reached through commitable_code_suggestions below.
#   - `restricted_mode = true` in [config] does NOT gate /improve. It withholds exactly one
#     capability, `push_code`, which /improve does not use — so keeping every caller free of
#     `contents: write` costs nothing here.

# Publish suggestions as inline review comments rather than one collapsed table. This is the key
# that makes this reviewer's inline shape real, and plan-marshall's automatic-review now records
# `inline` as participation evidence for this bot on exactly that basis.
commitable_code_suggestions = true

# Suppress the parts of the output that are UI rather than findings — the same treatment
# [pr_reviewer] gets above, and for the same reason: a consumer that collects this bot's comments
# as findings files every one of them as something to triage.
#
# The suppression here is NARROWER than [pr_reviewer]'s, and the difference is a real gap rather
# than an oversight. `enable_intro_text` does NOT exist under [pr_code_suggestions] in the pinned
# v0.39.0 image — the section declares 23 keys and that is not among them. It is a real key, but
# scoped to [pr_reviewer], which is exactly why a file-scoped grep for it returns a hit that says
# nothing about this section. It was set here once, on that mistaken reading, and was inert.
#
# No key under [pr_code_suggestions] is a rename of it. `publish_output_no_suggestions` and
# `persistent_comment` are behavioural neighbours, not drop-in equivalents, so substituting either
# would replace one unverified claim with another. The /improve preamble is therefore UNSUPPRESSED
# and that is a known, accepted state — not something a future edit should "fix" by guessing a key.
#
# Verify any addition here SECTION-SCOPED, never file-scoped: `enable_help_text` alone appears in
# nine sections of configuration.toml with differing defaults ([pr_analyze] defaults true).
enable_help_text = false
enable_chat_text = false

# One updated comment per pull request, matching persistent_comment in [pr_reviewer].
persistent_comment = true

# The substantiation bar carried over from the charter, and it is carried over DELIBERATELY: this
# tool writes suggested code into the diff, so a fabricated mechanism here costs more than it does
# in a review comment. The findings ceiling is stated in prose rather than as a numeric key so it
# reaches the model on the one channel that is guaranteed to be read, matching num_max_findings = 12
# above.
#
# Do not add withholding language to this block. The failure this reviewer actually had was
# silence, not noise — see README.adoc "A charter written against noise produces silence".
extra_instructions = """
Prioritise security and correctness over style.

Suggest a change only where you can name the input or state that makes the current code wrong, and
what goes wrong. A suggestion whose mechanism you have not traced in the code shown is a
fabrication, not a suggestion. That bar does not move when the diff looks thin.

Report at most 12 suggestions. That is a ceiling, not a target — do not pad toward it.

Severity is not a reporting threshold. A substantiated suggestion is worth making even when it is
narrow, cheap to fix, or confined to test code, and the reader decides what to act on. Do not
weigh whether an issue is important enough to mention, and do not withhold one because another
reviewer might also report it.

Do not suggest stylistic rewrites, renames for taste, or reformatting.
"""
