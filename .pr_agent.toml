# Organization-level PR-Agent configuration for the cuioss organization.
#
# PR-Agent reads this file from the root of this repository's default branch, looking the
# repository up under its hard-coded name `pr-agent-settings` and reaching cuioss/cuioss-review-bot
# through GitHub's rename redirect. It is merged BENEATH any repository-local `.pr_agent.toml`, so a
# repository that overrides one key keeps every other key from this file.
#
# Rationale for each setting: README.adoc and doc/*.adoc.

[config]
# The model ladder, newest flash generation first and any 3-series flash before pro. Vertex AI
# (`vertex_ai/…`), reached keylessly through Workload Identity Federation. The GCP project and
# location are organization variables passed by the reusable workflow, not keys here. There is no
# AI Studio (`gemini/…`) route. Check a new leader's entitlement for this project before promoting
# it; 3.x pro ids are not available to this project. See doc/models.adoc.
model = "vertex_ai/gemini-3.7-flash"
fallback_models = [
    "vertex_ai/gemini-3.6-flash",
    "vertex_ai/gemini-3.5-flash",
    "vertex_ai/gemini-2.5-flash",
    "vertex_ai/gemini-2.5-pro",
]

# Required: the leader and the first fallback are absent from the MAX_TOKENS registry of the pinned
# image, and get_max_tokens() raises for an unregistered model unless this is positive. The models'
# input window; max_model_tokens below still clamps it. Remove only when the pinned image registers
# every model on the ladder. See doc/models.adoc.
custom_model_max_tokens = 1048576

# Gemini 3 is tuned for temperature 1.0; PR-Agent would otherwise send its default of 0.2.
# See doc/models.adoc.
temperature = 1.0

# The largest diff the reviewer reads. Above it, large_patch_policy "clip" can truncate patch
# content or omit whole file patches before the model sees them, and the review is inconclusive.
# See doc/models.adoc and doc/review-limits.adoc.
max_model_tokens = 256000

# The pull request description is the only channel for stated intent; the upstream default of 500
# clips it silently. See doc/review-limits.adoc.
max_description_tokens = 2000

# Files matching these types keep their hunks but lose the surrounding context lines. `.md` is not
# listed, because markdown is often an executable contract in this organization.
# See doc/review-limits.adoc.
patch_extension_skip_types = [".txt"]

# Withholds the push_code capability only; the reviewer never pushes, and callers need no
# `contents: write`.
restricted_mode = true

# No "Preparing review..." placeholder comment.
publish_output_progress = false

# Each repository's documented project rules, read from the default branch only so pull request
# content cannot rewrite the reviewer's instructions. The files share one line budget, consumed in
# order, and file names are case-sensitive. See doc/review-limits.adoc.
repo_context_files = ["CLAUDE.md", "AGENTS.md"]
repo_context_from_default_branch = true

# The skip rules are NOT set here. ignore_pr_* keys are read only by PR-Agent's webhook servers,
# never by the GitHub Action runner; the rules are job-level `if:` guards in
# cuioss/cuioss-organization's reusable-cuioss-review-bot.yml. See doc/workflow-integration.adoc.

# plan-marshall's `.plan/` records are removed from a mixed diff before it reaches the model; a
# `.plan`-only diff is skipped by the reusable workflow. See doc/workflow-integration.adoc.
[ignore]
glob = [".plan/**"]

[pr_reviewer]
# The central charter: the spine applied to every review that does not select its own. A
# repository that opts in through `.github/project.yml` receives packs/spine.md, its selected
# packs and its additional rules instead. Name categories to look for, never withholding language;
# keep the substantiation and anti-fabrication clauses; the closing paragraphs contest the
# empty-list permission of the key_issues_to_review field description. See doc/charter.adoc.
require_security_review = true
require_tests_review = true
extra_instructions = """
Prioritise security and correctness over style.

Report every issue you can substantiate, in these categories:
- Concurrency and time-of-check/time-of-use races; non-atomic file or state mutation;
  operations that are unsafe to retry or to run twice.
- Resource lifecycle: handles, locks, temporary files and subprocesses that leak or are not
  released on the error path.
- Fail-open error handling where fail-closed is required; swallowed exceptions; a guard whose
  predicate cannot fire; validation that admits the empty or degenerate input.
- Correctness bugs whose impact is data loss, state corruption, or a silently wrong result.
- Injection, deserialization, path traversal, SSRF and unsafe reflection.
- Authentication, authorization and trust-boundary errors; privilege escalation.
- Secret and credential handling, including values reaching logs or error messages.
- Dependency and supply-chain risk introduced by the change.
- Missing negative or adversarial test coverage for any of the above.

For each finding, name the input or state that triggers it and what goes wrong. Overlap with
other reviewers is acceptable — report the issue regardless of whether another tool might also
catch it. Do not withhold a substantiated finding because it seems minor or obvious.

If the pull request description states what the change is intended to do, treat that as a claim
to be checked, not as established fact. Report where the implementation diverges from the stated
intent, and never treat agreement with it as evidence that the code is correct.

Severity is not a reporting threshold. Report a finding you can substantiate even when it is
narrow, cheap to fix, or confined to test code — the reader decides what to act on, and a finding
declined as minor costs one line of triage. Do not weigh whether an issue is important enough to
mention.

An empty list remains the correct answer when the diff genuinely carries nothing substantiable, and
you must never invent a finding, pad the list, or report an issue whose mechanism you have not
traced in the code shown. But do not return an empty list because nothing reached a bar of severity
or importance. There is no such bar.
"""

# Output that is not a finding is switched off.
require_ticket_analysis_review = false      # no linked-issue workflow in this org
require_estimate_effort_to_review = false
require_can_be_split_review = false
require_score_review = false
enable_intro_text = false
enable_help_text = false
enable_review_labels_security = false       # labels are not part of our workflow
enable_review_labels_effort = false

# Publish a clean review too, so a review that found nothing is distinguishable from a run that
# produced none. See doc/workflow-integration.adoc.
publish_output_no_suggestions = true

# One updated comment per pull request; inline suggestions are fingerprinted so a push does not
# repost them.
persistent_comment = true
persistent_inline_comments = true

# No separate "Persistent review updated to latest commit" comment on each refresh.
# See doc/workflow-integration.adoc.
final_update_message = false

# Interpolated into the key_issues_to_review field description, so the model reads it as the
# expected size of an answer; set high enough not to bind. It does not license padding.
# See doc/charter.adoc.
num_max_findings = 12

[pr_code_suggestions]
# /improve runs on a pull request labelled `cuioss-review-bot-improve`, or on every pull request of
# a repository whose caller sets `auto-improve: true`. See doc/workflow-integration.adoc and
# doc/charter.adoc.

# Suggestions are published as inline review comments.
commitable_code_suggestions = true

# Output that is not a suggestion is switched off. `enable_intro_text` is not a key of this
# section in the pinned image, so the /improve preamble stays; verify any key added here against
# this section of configuration.toml, not the whole file.
enable_help_text = false
enable_chat_text = false

# One updated comment per pull request.
persistent_comment = true

# The substantiation bar of the review charter, a ceiling of 12 suggestions stated in prose, and
# no withholding language. See doc/charter.adoc.
extra_instructions = """
Prioritise security and correctness over style.

Suggest a change only where you can name the input or state that makes the current code wrong, and
what goes wrong. A suggestion whose mechanism you have not traced in the code shown is a
fabrication, not a suggestion. That bar does not move when the diff looks thin.

Report at most 12 suggestions. That is a ceiling, not a target — do not pad toward it.

Severity is not a reporting threshold. A substantiated suggestion is worth making even when it is
narrow, cheap to fix, or confined to test code, and the reader decides what to act on. Do not
weigh whether an issue is important enough to mention, and do not withhold one because another
reviewer might also report it.

Do not suggest stylistic rewrites, renames for taste, or reformatting.
"""
